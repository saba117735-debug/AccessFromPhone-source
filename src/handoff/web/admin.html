<script>
// The opening animation plays on every launch; tests and anyone who wants it off can set afp_splash_off.
(function () {
  try {
    if (localStorage.getItem("afp_splash_off") === "1") document.documentElement.dataset.splash = "off";
    // once per launch: a reload, a reconnect or coming back to the app does not replay it (a session lasts until the app or tab is closed)
    else if (sessionStorage.getItem("afp_splash_seen") === "1") document.documentElement.dataset.splash = "off";
    else sessionStorage.setItem("afp_splash_seen", "1");
  } catch (e) {}
})();
</script>

<style>
  :root {
    color-scheme: dark;

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  h1, h2, h3, p { margin: 0; }

  /* ---------- the living background ---------- */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(120, 160, 220, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 160, 220, .05) 1px, transparent 1px); background-size: 44px 44px; -webkit-mask-image: radial-gradient(70% 60% at 50% 35%, #000 25%, transparent 78%); mask-image: radial-gradient(70% 60% at 50% 35%, #000 25%, transparent 78%); }
  .blob { position: absolute; width: 56vmax; height: 56vmax; border-radius: 50%; filter: blur(90px); opacity: .32; will-change: transform; }
  .blob.b1 { left: -18vmax; top: -22vmax; background: radial-gradient(circle, #1b6fe8, transparent 65%); animation: drift1 24s ease-in-out infinite alternate; }
  .blob.b2 { right: -22vmax; top: 6vmax; background: radial-gradient(circle, #0fb7d4, transparent 65%); animation: drift2 30s ease-in-out infinite alternate; opacity: .22; }
  .blob.b3 { left: 22vmax; bottom: -34vmax; background: radial-gradient(circle, #6d4ae8, transparent 65%); animation: drift3 28s ease-in-out infinite alternate; opacity: .2; }
  @keyframes drift1 { to { transform: translate3d(9vmax, 7vmax, 0) scale(1.08); } }
  @keyframes drift2 { to { transform: translate3d(-8vmax, 9vmax, 0) scale(.94); } }
  @keyframes drift3 { to { transform: translate3d(6vmax, -8vmax, 0) scale(1.1); } }

  /* ---------- shared pieces ---------- */
  .brand { display: inline-flex; align-items: center; gap: 12px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 24px 60px -28px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .04); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line-strong); background: rgba(255, 255, 255, .04); cursor: pointer; font-weight: 600; font-size: .92rem; transition: transform .18s var(--ease), border-color .2s, background .2s, box-shadow .25s; white-space: nowrap; }

  /* entrance choreography */

  /* ---------- sign-in / setup ---------- */
  .stage { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: clamp(24px, 5vw, 80px); align-items: center; width: min(1240px, 100% - 48px); margin: 0 auto; padding: 40px 0; }
  .hero { display: flex; flex-direction: column; gap: 26px; }
  .hero h1 { font-size: clamp(2.2rem, 4.6vw, 3.7rem); line-height: 1.04; letter-spacing: -.035em; font-weight: 750; }
  .hero h1 em { font-style: normal; background: linear-gradient(120deg, var(--a1), var(--a2) 55%, var(--a3)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .feats .ico { width: 34px; height: 34px; padding: 8px; border-radius: 10px; background: rgba(34, 211, 238, .09); border: 1px solid rgba(34, 211, 238, .2); color: var(--a1); }
  .scene { width: min(100%, 520px); margin-top: 4px; }
  .scene svg { width: 100%; height: auto; overflow: visible; display: block; }
  .scene .link { stroke: url(#lg); stroke-width: 2; fill: none; stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  .scene .pulse { transform-origin: center; transform-box: fill-box; animation: wave 3s ease-out infinite; }
  .scene .pulse.p2 { animation-delay: 1s; } .scene .pulse.p3 { animation-delay: 2s; }
  @keyframes wave { from { transform: scale(.4); opacity: .7; } to { transform: scale(1.5); opacity: 0; } }
  .scene .screen-glow { animation: glow 4s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .55; } to { opacity: 1; } }

  .panel { display: grid; place-items: center; }
  .auth { width: min(100%, 440px); padding: 34px 32px 30px; }
  .auth h2 { font-size: 1.55rem; letter-spacing: -.02em; margin-bottom: 6px; }
  .auth .sub { color: var(--muted); margin-bottom: 22px; }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-size: .8rem; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin-bottom: 6px; }
  .input { position: relative; }
  .input input { width: 100%; height: 48px; padding: 0 44px 0 44px; border-radius: 13px; border: 1px solid var(--line-strong); background: rgba(4, 10, 20, .6); transition: border-color .2s, box-shadow .25s, background .2s; }
  .input input:focus { outline: none; border-color: var(--a1); box-shadow: 0 0 0 4px rgba(34, 211, 238, .14); background: rgba(4, 10, 20, .85); }
  /* These fields already have a show/hide button; suppress Edge's duplicate. */
  .input input[type="password"]::-ms-reveal { display: none; }
  .input .lead-ico { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--faint); transition: color .2s; pointer-events: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .input .eye { position: absolute; right: 6px; top: 50%; translate: 0 -50%; width: 36px; height: 36px; display: grid; place-items: center; border: 0; background: none; color: var(--faint); border-radius: 9px; cursor: pointer; }
  .input .eye:hover { color: var(--text); background: rgba(255, 255, 255, .06); }

  .err.show { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
  .auth .btn.primary { width: 100%; min-height: 48px; font-size: 1rem; }
  .aside { margin-top: 16px; display: flex; gap: 10px; align-items: flex-start; color: var(--faint); font-size: .84rem; }
  .aside .ico { width: 16px; height: 16px; margin-top: 3px; color: var(--a1); }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--a1); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .recovery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 18px 0 14px; }
  .recovery b { font: 600 1.25rem/1 ui-monospace, "Cascadia Code", Consolas, monospace; letter-spacing: .12em; text-align: center; padding: 16px 6px; border-radius: 12px; background: rgba(245, 184, 97, .07); border: 1px dashed rgba(245, 184, 97, .45); color: var(--warn); user-select: all; }
  .check { display: flex; align-items: center; gap: 10px; margin: 16px 0; cursor: pointer; color: #c4d4ec; }
  .check input { width: 18px; height: 18px; accent-color: var(--a1); }

/* ---------- dashboard ---------- */
  .wrap { width: min(1120px, 100% - 40px); margin: 0 auto; padding: 22px 0 70px; }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 6px 0 26px; }
  .nav .right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--grad); color: #04101f; font-weight: 800; font-size: .8rem; }
  .greet { margin-bottom: 22px; }
  .greet h1 { font-size: clamp(1.7rem, 3.4vw, 2.5rem); letter-spacing: -.03em; line-height: 1.1; }
  .greet h1 em { font-style: normal; background: linear-gradient(120deg, var(--a1), var(--a2) 60%, var(--a3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .greet p { color: var(--muted); margin-top: 8px; }

  .connect { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(22px, 4vw, 54px); align-items: center; padding: clamp(22px, 3.4vw, 40px); position: relative; overflow: hidden; }
  .connect::after { content: ""; position: absolute; right: -90px; top: -90px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(34, 211, 238, .16), transparent 70%); pointer-events: none; }
  .qrbox { position: relative; width: 268px; height: 268px; display: grid; place-items: center; }
  .qrbox .ringsvg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .qrbox .ringsvg circle { fill: none; stroke-width: 1.4; }
  .qrbox .track { stroke: rgba(148, 178, 220, .12); }
  .qrbox .prog { stroke: url(#rg); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; }
  .qrbox .prog.run { animation: drain linear forwards; animation-duration: var(--dur, 120s); }
  @keyframes drain { to { stroke-dashoffset: 100; } }
  .qr { position: relative; width: 224px; height: 224px; padding: 12px; background: #fff; border-radius: 20px; line-height: 0; box-shadow: 0 0 0 1px rgba(255, 255, 255, .6), 0 20px 50px -14px rgba(34, 211, 238, .35); animation: qrin .7s var(--ease) both; overflow: hidden; }
  .qr svg { width: 100%; height: 100%; }
  .qr .sweep { position: absolute; left: 0; right: 0; top: 0; height: 46%; background: linear-gradient(180deg, transparent, rgba(34, 211, 238, .28)); border-bottom: 2px solid rgba(34, 211, 238, .85); animation: sweep 2.8s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateY(-100%); } 100% { transform: translateY(220%); } }
  @keyframes qrin { from { opacity: 0; transform: scale(.88); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  .qrbox .corner { position: absolute; width: 30px; height: 30px; border: 3px solid var(--a1); animation: bracket 2.4s ease-in-out infinite; }
  .qrbox .corner.tl { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
  .qrbox .corner.tr { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
  .qrbox .corner.bl { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
  .qrbox .corner.br { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
  @keyframes bracket { 50% { opacity: .4; transform: scale(.94); } }
  .connect h2 { font-size: 1.5rem; letter-spacing: -.02em; }
  .connect .sub { color: var(--muted); margin: 6px 0 20px; max-width: 32em; }
  .steps { list-style: none; counter-reset: s; padding: 0; margin: 0 0 22px; display: grid; gap: 12px; }
  .steps li { counter-increment: s; display: flex; align-items: flex-start; gap: 12px; color: #c4d4ec; }
  .steps li::before { content: counter(s); flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--a1); background: rgba(34, 211, 238, .1); border: 1px solid rgba(34, 211, 238, .3); }
  .codeline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .code { font: 650 1.7rem/1 ui-monospace, "Cascadia Code", Consolas, monospace; letter-spacing: .16em; padding: 12px 18px; border-radius: 14px; background: rgba(4, 10, 20, .6); border: 1px solid var(--line-strong); color: var(--a1); text-shadow: 0 0 22px rgba(34, 211, 238, .45); }
  .timer { color: var(--faint); font-size: .85rem; margin-top: 12px; font-variant-numeric: tabular-nums; }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 18px 0; }
  .stat { padding: 18px 20px; display: flex; align-items: center; gap: 14px; }
  .stat .ico { width: 42px; height: 42px; padding: 10px; border-radius: 12px; background: rgba(34, 211, 238, .09); border: 1px solid rgba(34, 211, 238, .22); color: var(--a1); }
  .stat small { display: block; color: var(--faint); font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; }
  .stat strong { font-size: 1.12rem; font-weight: 650; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 2px 14px; }
  .section-head h2 { font-size: 1.15rem; }
  .section-head span { color: var(--faint); font-size: .86rem; }
  .devices { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .device { padding: 20px; display: flex; flex-direction: column; gap: 16px; transition: transform .25s var(--ease), border-color .25s; animation: rise .6s var(--ease) both; }
  .device:hover { transform: translateY(-3px); border-color: var(--line-strong); }
  .device.fresh { animation: rise .6s var(--ease) both, arrive 2.4s ease-out; }
  @keyframes arrive { 0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .65); border-color: var(--ok); } 100% { box-shadow: 0 0 0 26px rgba(52, 211, 153, 0); } }
  .device .top { display: flex; align-items: center; gap: 14px; }
  .device .badge { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: linear-gradient(145deg, rgba(34, 211, 238, .16), rgba(59, 130, 246, .12)); border: 1px solid rgba(34, 211, 238, .24); color: var(--a1); flex: none; }
  .device.blocked .badge { background: rgba(255, 107, 129, .08); border-color: rgba(255, 107, 129, .25); color: var(--bad); }
  .device .badge .ico { width: 24px; height: 24px; }
  .device h3 { font-size: 1.04rem; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .device .meta { color: var(--faint); font-size: .84rem; }
  .device .grow { min-width: 0; flex: 1; }
  .device .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { padding: 44px 24px; text-align: center; display: grid; justify-items: center; gap: 12px; color: var(--muted); }
  .empty svg { width: 120px; height: auto; opacity: .9; }
  .empty h3 { color: var(--text); font-size: 1.1rem; }
  .foot { margin-top: 38px; text-align: center; color: var(--faint); font-size: .84rem; }

  .details { margin-top: 18px; padding: 4px 22px; }
  .details summary { cursor: pointer; padding: 16px 0; color: var(--muted); font-weight: 600; list-style: none; display: flex; align-items: center; gap: 10px; }
  .details summary::-webkit-details-marker { display: none; }
  .details .body { padding: 0 0 20px; display: grid; gap: 10px; max-width: 380px; }


  /* ---------- connection card + tabs ---------- */
  .tabs { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(4, 10, 20, .5); }
  .tab { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-weight: 600; font-size: .86rem; cursor: pointer; transition: background .2s, color .2s; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: #04101f; background: var(--grad); box-shadow: 0 6px 18px -8px rgba(34, 211, 238, .7); }
  .tab:focus-visible { outline: 2px solid var(--a1); outline-offset: 2px; }
  .conn { padding: 22px 22px 8px; }
  .conn-row { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
  .conn-row.col { flex-direction: column; align-items: stretch; gap: 12px; }
  .conn-head { display: flex; align-items: center; gap: 14px; }
  .conn-ico { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; color: var(--a1); background: rgba(34, 211, 238, .09); border: 1px solid rgba(34, 211, 238, .22); }
  .conn .grow { flex: 1; min-width: 0; }
  .conn h3 { font-size: 1rem; font-weight: 650; }
  .conn p { color: var(--text); font-size: .9rem; word-break: break-all; }
  .conn small { display: block; color: var(--faint); font-size: .8rem; margin-top: 2px; }
  .tag:not(.ok):not(.bad) { color: var(--muted); border: 1px solid var(--line-strong); background: rgba(255, 255, 255, .03); }
  .checks { list-style: none; margin: 0; padding: 0 0 0 58px; display: grid; gap: 10px; }
  .chk { display: flex; gap: 12px; align-items: flex-start; }
  .chk .mark { flex: none; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--line-strong); color: #04101f; margin-top: 1px; }
  .chk .mark i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
  .chk.ok .mark { background: var(--ok); border-color: var(--ok); } .chk.ok .mark .ico { width: 14px; height: 14px; stroke-width: 3; }
  .chk b { font-weight: 600; font-size: .9rem; } .chk small { margin-top: 1px; }
  .row-actions { display: flex; gap: 10px; padding-left: 58px; flex-wrap: wrap; }
  .row-actions a { text-decoration: none; color: inherit; }

      ? (ui.conn && ui.conn.anywhere.provider === "relay"
        ? [el("li", {}, "Scan the code with the phone's camera."), el("li", {}, "Tap the link. It opens your PC's own address on " + ui.conn.anywhere.name + "."), el("li", {}, "Works on any network, with no warning. Nothing to install and nothing to set up on the router.")]
        : [el("li", {}, "Install Tailscale on the phone and sign in to the same account as this PC."), el("li", {}, "Scan the code, then tap the link your camera shows."), el("li", {}, "No “not private” warning: this address has a real certificate. It works at home and away.")])
      : [el("li", {}, "Put the phone on the same Wi-Fi as this PC."), el("li", {}, "Scan the code, then tap the link your camera shows."),
         state.https ? el("li", {}, "First time only: the phone says “not private”. Choose Advanced, then Continue.") : el("li", {}, "The page opens and you're connected.")];
    const body = el("div", {}, tabs, el("h2", {}, anywhereOn ? "Connect from anywhere" : "Connect a phone"),
      el("p", { class: "sub" }, anywhereOn ? (ui.conn && ui.conn.anywhere.provider === "relay" ? "This phone will reach your PC from any network, through " + ui.conn.anywhere.name + "." : "This phone will reach your PC over your private Tailscale network, on any connection.") : "Open the camera on your phone and point it at the code. That's it."),
      el("ol", { class: "steps" }, steps),
      el("div", { class: "codeline" }, el("span", { class: "code" }, r.code), copy, el("button", { class: "btn sm ghost", onclick: pairing }, ico("refresh"), "New code")), left);
    pairBox.replaceChildren(box, body);
    ui.pair = r; paintMini();
  }

  async function switchVia(to) {
    if (to === via) return;
    if (to === "anywhere" && !(ui.conn && ui.conn.anywhere.active)) {
      // not on yet: try to switch it on; if something is still missing, show what
      await turnOnAnywhere();
      if (!(ui.conn && ui.conn.anywhere.active)) { toast("Anywhere isn't ready yet", "Finish the steps in the Connection section.", "warn"); setView("connection"); return; }
    }
    via = to; sessionStorage.setItem("afp_via", via); pairing();
  }

  /* ---------- unlocking this PC from a phone ---------- */
  async function loadUnlock() {
    let u;
    try { u = await call("/admin/unlock"); } catch (e) { if (e.status === 401) { clearTimers(); load(); } return; }
    const changed = JSON.stringify(u) !== JSON.stringify(ui.unlock);
    ui.unlock = u; paintUnlock();
    if (changed && ui.view === "overview") paintView();
  }
  let unlockWatch = null;
  function watchUnlock() {  // after the setup window opens: look every few seconds until it is done (or a few minutes have passed)
    clearInterval(unlockWatch);
    let rounds = 0;
    unlockWatch = setInterval(async () => {
      rounds += 1;
      try {
        const u = await call("/admin/unlock");
        if (u.running && u.configured) { clearInterval(unlockWatch); ui.unlock = u; paintUnlock(); toast("Unlocking is set up", "Try “unlock my PC” from your phone while the PC is locked.", ""); }
        else if (rounds > 100) { clearInterval(unlockWatch); loadUnlock(); }
      } catch (e) { /* the page's own session handling deals with a sign-out */ }
    }, 3000);
  }
  function paintUnlock() {
    const u = ui.unlock, box = ui.unlockBox;
    if (!u || !box) return;
    const on = u.running && u.configured && u.enabled && !u.attention;
    const tag = !u.running || !u.configured ? el("span", { class: "tag" }, "Not set up") : u.attention ? el("span", { class: "tag bad" }, "Stopped") : u.enabled ? el("span", { class: "tag ok live" }, "On") : el("span", { class: "tag" }, "Off");
    const lines = [];
    if (!u.running || !u.configured) {
      lines.push(el("p", {}, "Write “unlock my PC” on your phone while this PC is locked. You approve it and type your unlock PIN."),
        el("small", {}, u.setting_up ? "A setup window has opened on this PC. Finish it there (this card updates by itself)." : "Setting it up takes a minute at this PC: Windows asks for permission once, then you choose your unlock PIN. Your Windows Hello PIN is the safer thing to keep: it only works on this one PC."));
    } else {
      lines.push(el("p", {}, "Saved sign-in: " + (u.kind === "pin" ? "Windows Hello PIN" : "Windows password") + ". " + (u.locked === true ? "This PC is locked right now." : u.locked === false ? "This PC is unlocked." : "")));
      if (u.attention) lines.push(el("small", { class: "warnline" }, u.auto_resume_in ? "It paused: typing the saved sign-in didn't unlock the PC twice. It will start again by itself in about " + Math.max(1, Math.round(u.auto_resume_in / 60)) + " min (" + (u.auto_resumes_left == null ? "" : u.auto_resumes_left + " automatic restart" + (u.auto_resumes_left === 1 ? "" : "s") + " left; ") + "or tap Start trying again to go now)." : "It stopped itself: typing the saved sign-in didn't unlock the PC, even after trying again by itself. Make sure the saved sign-in is still your Windows PIN, then tap Start trying again."));
      else if (!u.enabled) lines.push(el("small", {}, "Switched off. To turn it on again run  python -m handoff.unlock.setup install."));
      else if (u.locked_for) lines.push(el("small", { class: "warnline" }, "Paused for about " + Math.max(1, Math.round(u.locked_for / 60)) + " more minute(s) after wrong PINs."));
      else lines.push(el("small", {}, "Three wrong PINs pause it for ten minutes. If typing the sign-in doesn't unlock the PC twice, it stops by itself."));
    }
    const setupBtn = !(u.running && u.configured) ? el("div", { class: "row-actions" },
      el("button", { class: "btn sm primary", disabled: !!u.setting_up, onclick: async () => {
        try { await call("/admin/unlock/setup", "POST"); ui.unlock.setting_up = true; paintUnlock(); toast("Setup window opened", "Finish it on this PC.", ""); watchUnlock(); }
        catch (e) { toast("Couldn't open the setup window", e.message, "warn"); }
      } }, ico("lock"), u.setting_up ? "Setup is open…" : "Set up unlocking")) : null;
    const actions = setupBtn || (u.running && u.configured ? el("div", { class: "row-actions" },
      u.attention ? el("button", { class: "btn sm primary", onclick: async () => { try { await call("/admin/unlock/resume", "POST"); toast("It will try again", "", ""); } catch (e) { toast("Couldn't restart it", e.message, "warn"); } loadUnlock(); } }, ico("refresh"), "Start trying again") : null,
      u.enabled ? el("button", { class: "btn sm", onclick: async () => { try { await call("/admin/unlock/disable", "POST"); toast("Unlocking is off", "", "warn"); } catch (e) { toast("Couldn't switch it off", e.message, "warn"); } loadUnlock(); } }, ico("ban"), "Switch off") : null,
      !u.enabled ? el("button", { class: "btn sm primary", onclick: async () => { try { await call("/admin/unlock/enable", "POST"); toast("Unlocking is on", "", ""); } catch (e) { toast("Couldn't switch it on", e.message, "warn"); } loadUnlock(); } }, ico("check"), "Switch on") : null,
      el("button", { class: "btn sm danger", onclick: async () => {
        const yes = await ask({ title: "Remove the saved sign-in?", text: "The PC forgets your Windows sign-in and unlocking stops working until you set it up again.", ok: "Remove it", danger: true });
        if (yes) { try { await call("/admin/unlock/forget", "POST"); toast("Saved sign-in removed", "", "warn"); } catch (e) { toast("Couldn't remove it", e.message, "warn"); } loadUnlock(); }
      } }, ico("trash"), "Remove saved sign-in")) : null);
    box.replaceChildren(el("div", { class: "section-head", style: "margin-top:0" }, el("h2", {}, "Unlock this PC from your phone"), el("span", {}, "")),
      el("div", { class: "conn-row col" }, el("div", { class: "conn-head" }, el("div", { class: "conn-ico" }, ico("lock")), el("div", { class: "grow" }, el("h3", {}, "Unlock by asking"), ...lines), tag), actions));
  }

  /* ---------- how phones reach this PC ---------- */
  async function loadConnection() {
    let c;
    try { c = await call("/admin/connection"); } catch (e) { if (e.status === 401) { clearTimers(); load(); } return; }
    ui.conn = c; paintConnection();
    if (ui.view === "overview") paintView();
  }
  async function turnOnAnywhere() {
    try { const a = await call("/admin/connection/anywhere", "POST"); if (ui.conn) ui.conn.anywhere = a; paintConnection(); if (a.active) toast("Anywhere access is on", a.url, ""); } catch (e) { toast("Couldn't check", e.message, "warn"); }
  }
  function stepRow(s) {
    return el("li", { class: "chk" + (s.ok ? " ok" : "") }, el("span", { class: "mark" }, s.ok ? ico("check") : el("i")), el("div", {}, el("b", {}, s.label), s.ok ? null : el("small", {}, s.hint)));
  }
  function paintConnection() {
    const c = ui.conn, box = ui.connBox;
    if (!c || !box) return;
    const a = c.anywhere;
    const wifi = el("div", { class: "conn-row" }, el("div", { class: "conn-ico" }, ico("wifi")), el("div", { class: "grow" },
      el("h3", {}, "Same Wi-Fi"), el("p", {}, c.lan.url), el("small", {}, state.https ? "Encrypted. Phones show a one-time “not private” notice, because the certificate is made on this PC." : "Plain link on your own network.")),
      el("span", { class: "tag ok" }, "Ready"));
    const any = el("div", { class: "conn-row col" },
      el("div", { class: "conn-head" }, el("div", { class: "conn-ico" }, ico("globe")), el("div", { class: "grow" }, el("h3", {}, "Anywhere"),
        el("p", {}, a.active ? a.url : a.provider === "relay" ? "Reach this PC from any network through " + a.name + "." : "Reach this PC from any network, with a trusted certificate (no warning)."),
        el("small", {}, a.provider === "relay" ? "Your PC connects out to the server, so there is nothing to install and nothing to open on your router." : "Uses Tailscale: free, private, and no ports to open on your router.")),
        a.active ? el("span", { class: "tag ok live" }, "On") : a.enabled ? el("span", { class: "tag" }, "Not set up") : el("span", { class: "tag" }, "Off in config")),
      a.enabled && !a.active ? el("ul", { class: "checks" }, a.steps.map(stepRow)) : null,
      a.enabled && !a.active ? el("div", { class: "row-actions" }, el("button", { class: "btn sm primary", onclick: turnOnAnywhere }, ico("refresh"), a.ready ? "Turn on" : "Check again"),
        a.provider !== "relay" && !a.installed ? el("a", { class: "btn sm", href: "https://tailscale.com/download", target: "_blank", rel: "noopener noreferrer" }, "Get Tailscale") : null) : null,
      a.error && !a.active ? el("p", { class: "err show" }, a.error) : null);
    const wake = el("div", { class: "conn-row col" }, el("div", { class: "conn-head" }, el("div", { class: "conn-ico" }, ico("power")), el("div", { class: "grow" },
      el("h3", {}, "If this PC sleeps"),
      el("p", {}, c.power.keep_awake ? "It stays awake while this app runs, so your phone can always reach it. The screen can still turn off." : "Keeping awake is off. If the PC sleeps, the phone can't reach it until it wakes."),
      el("small", {}, "To wake a sleeping PC from afar you need Wake-on-LAN turned on in its BIOS and network adapter, and a router or always-on device to send the wake signal.")),
      el("span", { class: "tag " + (c.power.keep_awake ? "ok" : "") }, c.power.keep_awake ? "Staying awake" : "May sleep")),
      el("div", { class: "macline" }, el("span", {}, "This PC's network address (MAC)"), el("code", {}, c.wake.mac), el("button", { class: "btn sm ghost", onclick: async () => { try { await navigator.clipboard.writeText(c.wake.mac); toast("Copied", c.wake.mac, ""); } catch (e) { toast("Select it and copy", "", "warn"); } } }, ico("copy"), "Copy"),
        c.wake.reliable ? null : el("small", { class: "warnline" }, "This looks made up. Check it in Windows network settings before using it.")));
    box.replaceChildren(el("div", { class: "section-head", style: "margin-top:0" }, el("h2", {}, "How phones reach this PC"), el("span", {}, "")), wifi, any, wake);
  }

  function setOnline(on) { if (!ui.online) return; ui.online.querySelector(".dot").classList.toggle("off", !on); ui.online.lastChild.textContent = state.pc + (on ? " · Online" : " · Offline"); }
  function emptyArt() { const w = el("div"); w.innerHTML = '<svg viewBox="0 0 120 90" fill="none"><rect x="44" y="8" width="32" height="64" rx="8" stroke="rgba(148,178,220,.45)" stroke-width="2"/><rect x="49" y="16" width="22" height="42" rx="4" fill="rgba(34,211,238,.08)"/><circle cx="60" cy="64" r="2" fill="rgba(148,178,220,.5)"/><path d="M20 40c6-10 14-14 22-14M100 40c-6-10-14-14-22-14" stroke="rgba(34,211,238,.4)" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 6"/></svg>'; return w.firstChild; }

  async function devices() {
    let list;
    try { list = await call("/admin/devices"); setOnline(true); } catch (e) { if (e.status === 401) { clearTimers(); load(); } else setOnline(false); return; }
    const fresh = known ? list.filter((d) => !known.has(d.id)) : [];
    known = new Set(list.map((d) => d.id));
    if (fresh.length) { toast(fresh[0].name + " connected", "Ready to use from now on.", ""); pairing(); } // the code that was used is spent
    const sig = JSON.stringify(list.map((d) => [d.id, d.name, d.blocked, isLive(d.last_seen), ago(d.last_seen), d.last_ip]));
    if (sig === paintedSig) return; // nothing changed: leave the cards alone so they don't flicker
    const firstPaint = paintedSig === ""; paintedSig = sig;
    ui.devices = list;
    if (ui.view === "overview" || ui.view === "phones") paintView();
    if (!list.length) {
      devicesBox.replaceChildren(el("div", { class: "card empty", style: "grid-column:1/-1" }, emptyArt(), el("h3", {}, "No phone connected yet"), el("p", {}, "Scan the code above with your phone's camera. It will appear here the moment it connects.")));
      return;
    }
    devicesBox.replaceChildren(...list.map((d, i) => deviceCard(d, fresh.some((f) => f.id === d.id), firstPaint ? i : -1)));
  }

  function deviceCard(d, isNew, i) {
    const live = isLive(d.last_seen) && !d.blocked;
    return el("article", { class: "card device" + (d.blocked ? " blocked" : "") + (isNew ? " fresh" : ""), style: i >= 0 ? "animation-delay:" + (i * 70) + "ms" : (isNew ? "" : "animation: none") },
      el("div", { class: "top" }, el("div", { class: "badge" }, ico(kindOf(d.name))),
        el("div", { class: "grow" }, el("h3", { title: d.name }, d.name), el("div", { class: "meta" }, ago(d.last_seen) + (d.last_ip ? " · " + d.last_ip : ""))),
        d.blocked ? el("span", { class: "tag bad" }, "Blocked") : d.signed_out ? el("span", { class: "tag", title: "This phone signed itself out. It comes back as the same phone when it connects again." }, "Signed out") : (!live && Date.now() - Date.parse(d.last_seen) > 14 * 864e5) ? el("span", { class: "tag", title: "Not used for over two weeks. Remove it if this phone was reinstalled or is gone." }, "Not used lately") : el("span", { class: "tag ok" + (live ? " live" : "") }, live ? "Online" : "Allowed")),
      el("div", { class: "actions" },
        el("button", { class: "btn sm", onclick: async () => { const n = await ask({ title: "Rename this phone", text: "This is the name you see here and in the log.", input: true, value: d.name, ok: "Save" }); if (n) { await call("/admin/devices/" + d.id + "/rename", "POST", { name: n }); toast("Renamed", n, ""); devices(); } } }, ico("pencil"), "Rename"),
        el("button", { class: "btn sm", onclick: async () => { await call("/admin/devices/" + d.id + (d.blocked ? "/unblock" : "/block"), "POST"); toast(d.blocked ? "Unblocked" : "Blocked", d.name, d.blocked ? "" : "warn"); devices(); } }, ico("ban"), d.blocked ? "Unblock" : "Block"),
        el("button", { class: "btn sm danger", onclick: async () => { const yes = await ask({ title: "Remove “" + d.name + "”?", text: "It is signed out at once and must be paired again to use this PC.", ok: "Remove phone", danger: true }); if (yes) { await call("/admin/devices/" + d.id, "DELETE"); toast("Phone removed", d.name, "warn"); devices(); } } }, ico("trash"), "Remove")));
  }

  {
    const splash = document.getElementById("splash");
    if (splash) {
      if (getComputedStyle(splash).display === "none") splash.remove();
      else { splash.addEventListener("animationend", (e) => { if (e.animationName === "sp-out") splash.remove(); }); setTimeout(() => splash.remove(), 1500); }
    }
  }
  load();
})();
</script>
